<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinseonmi</title>
<style>
:root{
  --bg:#faf6f4;--card:#fff;--text:#231c1f;--muted:#7d7275;--border:#eee3df;
  --primary:#d9467a;--primary-soft:#fde8ef;
  --med:#0f9d7a;--med-soft:#e0f5ef;
  --sponsor:#e8590c;--sponsor-soft:#fff0e6;
  --warn:#8a6d00;--warn-soft:#fff6d6;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#e9e3e0;color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
.phone{position:relative;max-width:420px;height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){body{padding:24px 0}.phone{height:min(880px,calc(100vh - 48px));border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.18)}}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;background:var(--bg)}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em}
.logo b{color:var(--primary)}
.hdr-r{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:15px}
.badge-n{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}

/* layout */
.content{flex:1;overflow-y:auto;padding:0 14px 18px}
.sample{display:flex;gap:6px;align-items:center;background:var(--warn-soft);color:var(--warn);font-size:11px;border-radius:10px;padding:6px 10px;margin-bottom:12px}
.sec-t{font-size:15px;font-weight:700;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t small{font-weight:400;color:var(--muted);font-size:11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);background:var(--card);padding:6px 6px 10px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--primary);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--primary)}

/* buttons */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--primary);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.line{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn.med{background:var(--med)}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}

/* tags */
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap}
.tag.sp-yes{background:var(--sponsor-soft);color:var(--sponsor)}
.tag.sp-none{background:#eef2f0;color:#4b6358}
.tag.sp-unknown{background:#f1eff6;color:#6a5f86}
.tag.med{background:var(--med-soft);color:var(--med)}
.tag.beauty{background:var(--primary-soft);color:var(--primary)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:#e3f6e8;color:#2b8a3e}

/* onboarding */
.ob{flex:1;display:flex;flex-direction:column;padding:28px 22px 22px;overflow-y:auto}
.ob-steps{display:flex;gap:6px;margin-bottom:26px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.ob-steps i.on{background:var(--primary)}
.ob h2{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.ob p.hint{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.45}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--border);background:var(--card);border-radius:14px;padding:12px;text-align:left;font-size:14px}
.opt.on{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.opt.big{padding:18px;font-size:17px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px}
.pill.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.pill.med.on{border-color:var(--med);background:var(--med-soft);color:var(--med)}
.field{width:100%;border:1.5px solid var(--border);background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
.field:focus{border-color:var(--primary)}
.ob-foot{margin-top:auto;padding-top:22px;display:flex;gap:8px}
.ob-foot .btn{flex:1}

/* home */
.ad{position:relative;border-radius:20px;padding:14px;background:linear-gradient(135deg,#ffb26b,#ff7b54);color:#fff;overflow:hidden}
.ad .ad-l{display:inline-block;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;letter-spacing:.05em}
.ad h3{margin:8px 0 2px;font-size:17px}
.ad p{margin:0;font-size:11px;opacity:.95}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.rec{flex:0 0 72%;scroll-snap-align:start}
.thumb{border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:20px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{text-align:left;border-radius:18px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.cat b{font-size:14px}
.cat span{font-size:11px;opacity:.8}
.note{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--muted);background:#f3eeec;border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.4}

/* explore */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#efe8e5;border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{padding:8px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card)}
.tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
.tabs button.sp.on{background:var(--sponsor);border-color:var(--sponsor)}
.split{display:grid;grid-template-columns:40% minmax(0,1fr);gap:8px}
.rank-item{display:flex;gap:7px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--card);border-radius:14px;padding:7px;margin-bottom:6px}
.rank-item.on{border-color:var(--primary);background:var(--primary-soft)}
.rank-item.medi.on{border-color:var(--med);background:var(--med-soft)}
.rank-item.spi.on{border-color:var(--sponsor);background:var(--sponsor-soft)}
.rk{font-size:11px;font-weight:800;color:var(--primary)}
.medi .rk{color:var(--med)}
.spi .rk{color:var(--sponsor)}
.detail h3{margin:0;font-size:15px;line-height:1.25}
.ev{list-style:none;margin:8px 0 0;padding:0}
.ev li{display:flex;justify-content:space-between;gap:6px;font-size:11px;padding:5px 0;border-top:1px dashed var(--border)}
.ev li b{font-weight:700}
.shorts{height:250px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px;margin-top:8px}
.short{height:230px;margin-bottom:8px;scroll-snap-align:start;border-radius:16px;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.short .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:18px}
.price{font-weight:800;font-size:15px}
.conv{font-size:11px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.cmp > *{border-radius:12px;padding:8px;font-size:11px;background:#f6f2f0;min-width:0}
.alt{background:linear-gradient(135deg,#fff,#fdf0f4);margin-bottom:10px}

/* overlay & sheets */
.scrim{position:absolute;inset:0;background:rgba(35,28,31,.45);z-index:30}
.drawer{position:absolute;top:0;right:0;bottom:0;width:86%;background:var(--card);border-radius:24px 0 0 24px;z-index:31;display:flex;flex-direction:column}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:31;padding:18px;max-height:85%;overflow-y:auto}
.d-h{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
.d-b{flex:1;overflow-y:auto;padding:14px}
.d-f{border-top:1px solid var(--border);padding:14px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:24px;height:24px;border-radius:50%;background:#f1ebe8;font-size:13px}

/* tutorial */
.tut-scrim{position:absolute;inset:0;background:rgba(20,14,17,.6);z-index:40}
.tut-bubble{position:absolute;left:16px;right:16px;bottom:96px;background:var(--card);border-radius:18px;padding:16px;z-index:42}
.tut-bubble::after{content:"";position:absolute;bottom:-8px;width:16px;height:16px;background:var(--card);transform:rotate(45deg);left:var(--arrow-x,15%)}
.nav.tut{position:relative;z-index:41}
.nav.tut button{opacity:.35}
.nav.tut button.hl{opacity:1;background:var(--primary-soft);color:var(--primary);font-weight:700}
.tut-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:800;margin-right:6px}

/* trip */
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.stop:first-child{border-top:0}
.pin{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.time{font-size:12px;font-weight:700;width:44px;flex-shrink:0;padding-top:3px}
.map{border-radius:16px;overflow:hidden;background:#eef3ef;border:1px solid var(--border)}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;z-index:50;white-space:nowrap}
</style>
</head>

        ${['cleanser','toner','serum','sun','lip','cream'].map(c => `<option value="${c}" ${p.usingCat===c?'selected':''}>${t('c_' + c)}</option>`).join('')}
      </select>
    </div>
    <div id="alt-result" class="tiny" style="margin-top:8px">${match
      ? `<button class="row" data-a="select" data-v="${match.id}" style="text-align:left">“${esc(p.usingNow)}” → <b>${t('altResult', {cat: t('c_' + match.cat)})}: ${match.name}</b> ›</button>`
      : `<span class="muted">${t('altEmpty')}</span>`}</div>
  </div>`;
}
function beautyDetail(p) {
  const realPick = p.sponsored ? BEAUTY.find(b => b.cat === p.cat) : null;
  const ev = p.sponsored
    ? `<li><span>${t('ev_promo')}</span><b>${t('ev_promo_v')}</b></li>`
    : `<li><span>${t('ev_blog')}</span><b>${p.blog.toLocaleString()}</b></li>
       <li><span>${t('ev_store')}</span><b>#${p.store}</b></li>
       <li><span>${t('ev_trend')}</span><b>#${p.trend}</b></li>`;
  const shorts = [1,2,3].map(i => `<div class="short" style="background:linear-gradient(180deg,${HUES[p.hue]},#3b2a33)">
      <span class="tag" style="position:absolute;top:8px;left:8px;background:rgba(255,255,255,.25);color:#fff">#${i}</span>
      <div class="play">▶</div><div class="tiny" style="opacity:.9">${t('shortPh')}</div></div>`).join('');
  return `<div class="card detail">
    <div class="row">${thumb(p, 40)}<div class="grow"><h3>${p.name}</h3><div class="tiny muted">${p.brand} · ${t('c_' + p.cat)}</div></div></div>
    <div class="row" style="margin-top:8px;justify-content:space-between">
      <div><div class="price">${won(p.price)}</div><div class="conv">${conv(p.price)}</div></div>
      <button class="btn sm" data-a="add-cart" data-v="${p.id}">${t('addCart')}</button>
    </div>
    <div class="row tiny" style="margin-top:8px;justify-content:space-between"><span class="muted">${t('sp')}</span>${spTag(p.sponsor)}</div>
    <div class="tiny" style="font-weight:700;margin-top:8px">${t('evidence')}</div>
    <ul class="ev">${ev}</ul>
    ${realPick ? `<div class="tiny" style="font-weight:700;margin-top:10px">${t('cmpTitle', {cat: t('c_' + p.cat)})}</div>
      <div class="cmp">
        <div><span class="tag sp-yes">AD</span><div class="trunc" style="margin-top:4px">${p.name}</div><b>${won(p.price)}</b></div>
        <button style="text-align:left" data-a="go-item" data-v="${realPick.id}"><div><span class="tag beauty">${t('real')}</span><div class="trunc" style="margin-top:4px">${realPick.name}</div><b>${won(realPick.price)}</b></div></button>
      </div>
      <div class="tiny muted" style="margin-top:4px">${t('notDiscount')}</div>` : ''}
    <div class="tiny" style="font-weight:700;margin-top:10px">${t('shorts')}</div>
    <div class="shorts">${shorts}</div>
  </div>`;
}
function medDetail(m) {
  const inTrip = S.trip.includes(m.id);
  return `<div class="card detail">
    <div class="row">${thumb(m, 40)}<div class="grow"><h3>${m.name}</h3><div class="tiny muted">${t('k_' + m.kind)} · ${m.area}</div></div></div>
    <div style="margin-top:8px"><div class="price">${t('from')} ${won(m.priceFrom)}</div><div class="conv">${conv(m.priceFrom)}</div></div>
    <div class="row tiny" style="margin-top:8px;justify-content:space-between"><span class="muted">${t('sp')}</span>${spTag(m.sponsor)}</div>
    <div class="tiny" style="font-weight:700;margin-top:8px">${t('evidence')}</div>
    <ul class="ev">
      ${m.sponsored ? `<li><span>${t('ev_promo')}</span><b>${t('ev_promo_v')}</b></li>` : `<li><span>${t('reviews')}</span><b>${m.reviews.toLocaleString()}</b></li>`}
      <li><span>${t('langs')}</span><b>${m.langs.join(' · ')}</b></li>
      <li><span>${t('area')}</span><b>${m.area}</b></li>
    </ul>
    <button class="btn med block" style="margin-top:10px;${inTrip?'background:var(--med-soft);color:var(--med)':''}" data-a="toggle-trip" data-v="${m.id}">${inTrip ? t('inTrip') : t('addTrip')}</button>
    <div class="note">⚕️ ${t('medDisc')}</div>
  </div>`;
}

/* ---------------- cart ---------------- */
function renderCart() {
  const entries = Object.entries(S.cart).map(([id, q]) => ({p: findB(id), q})).filter(e => e.p);
  const total = entries.reduce((n, e) => n + e.p.price * e.q, 0);
  return `<div class="scrim" data-a="close-cart"></div>
  <aside class="drawer">
    <div class="d-h"><div><b>${t('cart')}</b><div class="tiny muted">${t('items', {n: cartCount()})}</div></div><button class="icon-btn" data-a="close-cart">✕</button></div>
    <div class="d-b">${entries.length ? entries.map(({p, q}) => `
      <div class="card row" style="margin-bottom:8px">${thumb(p, 38)}
        <div class="grow"><div class="trunc" style="font-size:12px;font-weight:600">${p.name}</div>
          <div class="tiny muted">${won(p.price)} ${p.sponsored ? '<span class="tag sp-yes">AD</span>' : ''}</div></div>
        <div class="qty"><button data-a="qty" data-v="${p.id}:-1">−</button><b class="tiny">${q}</b><button data-a="qty" data-v="${p.id}:1">+</button></div>
      </div>`).join('') : `<div class="empty">${t('cartEmpty')}</div>`}</div>
    <div class="d-f">
      <div class="row" style="justify-content:space-between;font-weight:800"><span>${t('total')}</span><span>${won(total)}</span></div>
      ${userCur() !== 'KRW' ? `<div class="row" style="justify-content:space-between" ><span class="tiny muted">${t('rateNote')}</span><span class="conv" style="font-weight:700">${conv(total)}</span></div>` : ''}
      <button class="btn block" style="margin-top:10px" data-a="cart-to-trip" ${entries.length ? '' : 'disabled'}>🗺️ ${t('cartToTrip')}</button>
    </div>
  </aside>`;
}

/* ---------------- my trip ---------------- */
function tripStops() {
  const stops = [];
  const ids = Object.keys(S.cart);
  [...new Set(ids.map(id => findB(id)?.shop).filter(Boolean))].forEach(sid => {
    const sh = SHOPS[sid];
    stops.push({id:'shop-' + sid, type:'shop', name:sh.name, area:sh.area, x:sh.x, y:sh.y,
      items: ids.map(findB).filter(p => p && p.shop === sid).map(p => p.name)});
  });
  S.trip.forEach(mid => { const m = findM(mid); if (m) stops.push({id:'med-' + mid, type:'med', name:m.name, area:m.area, x:m.x, y:m.y}); });
  return stops.sort((a, b) => a.x - b.x); // simple west→east ordering (placeholder for a real routing provider)
}
function renderTrip() {
  const p = S.profile, prefs = p.prefs || {beauty:[], medical:[]};
  const hasPrefs = prefs.beauty.length || prefs.medical.length;
  const stops = tripStops();
  const prefCard = `<div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between"><b style="font-size:13px">🎯 ${t('personalize')}</b>
      <button class="btn sm line" data-a="prefs-toggle">${S.prefsOpen ? t('done') : t('edit')}</button></div>
    ${S.prefsOpen ? prefEditor(prefs.beauty, prefs.medical, 'pf')
      : `<div class="chips" style="margin-top:8px">${hasPrefs
          ? [...prefs.beauty.map(v => `<span class="tag beauty">${t('i_' + v)}</span>`), ...prefs.medical.map(v => `<span class="tag med">${t('k_' + v)}</span>`)].join('')
          : `<span class="tiny muted">${t('personalizeOff')}</span>`}</div>`}
  </div>`;
  if (!stops.length) return prefCard + `<div class="card empty">🧳<br>${t('emptyTrip')}<br><br><button class="btn" data-a="tab" data-v="explore">${t('goExplore')}</button></div>`;

  const color = s => s.type === 'med' ? 'var(--med)' : 'var(--primary)';
  const list = stops.map((s, i) => `<div class="stop"><div class="pin" style="background:${color(s)}">${i + 1}</div>
      <div class="grow"><div style="font-size:13px;font-weight:600">${esc(s.name)}</div>
      <div class="tiny muted">${s.type === 'med' ? t('medStop') : t('shopStop')} · ${s.area}</div>
      ${s.items ? `<div class="tiny muted">${t('forItems', {x: s.items.join(', ')})}</div>` : ''}</div></div>`).join('');

  const map = `<div class="map"><svg viewBox="0 0 100 60" style="display:block;width:100%;height:auto">
      <path d="M0 35 C20 31 35 38 55 33 S85 30 100 33" stroke="#a5d8ff" stroke-width="4" fill="none"/>
      <polyline points="${stops.map(s => `${s.x},${s.y * 0.6}`).join(' ')}" fill="none" stroke="#231c1f" stroke-width="0.8" stroke-dasharray="2 1.5"/>
      ${stops.map((s, i) => `<circle cx="${s.x}" cy="${s.y * 0.6}" r="3.2" fill="${s.type==='med'?'#0f9d7a':'#d9467a'}"/><text x="${s.x}" y="${s.y * 0.6 + 1.2}" font-size="3.4" text-anchor="middle" fill="#fff" font-weight="700">${i + 1}</text>`).join('')}
    </svg><div class="tiny muted" style="padding:6px 10px">🗺️ ${t('mapNote')}</div></div>`;

  const sched = stops.map((s, i) => {
    const mins = 10 * 60 + i * 100, hh = String(Math.floor(mins / 60)).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
    const ok = !!S.approvals[s.id];
    return `<div class="stop"><div class="time">${hh}:${mm}</div><div class="grow">
      <div style="font-size:13px;font-weight:600">${esc(s.name)}</div>
      <div class="row" style="margin-top:4px;flex-wrap:wrap">
        <span class="tag ${ok ? 'ok' : 'warn'}">${ok ? t('st_ok') : t('st_sug')}</span>
        ${s.type === 'med' ? `<span class="tag sp-unknown">${t('clinicPending')}</span>` : ''}
      </div></div>
      ${ok ? '' : `<button class="btn sm line" data-a="approve" data-v="${s.id}">${t('approve')}</button>`}</div>`;
  }).join('');

  return prefCard + `
    <div class="sec-t" style="margin-top:4px">${t('stops')}<small>${t('tripStops', {n: stops.length})}</small></div>
    <div class="card">${list}</div>
    ${S.routeBuilt
      ? `<div class="sec-t">🧭 Route</div>${map}<div class="sec-t">${t('schedule')}</div><div class="card">${sched}</div>`
      : `<button class="btn block" style="margin-top:12px" data-a="build-route">🧭 ${t('buildRoute')}</button>`}`;
}

/* ---------------- settings & tutorial ---------------- */
function renderSettings() {
  const p = S.profile;
  return `<div class="scrim" data-a="close-settings"></div>
  <div class="sheet">
    <div class="row" style="justify-content:space-between"><b style="font-size:16px">${t('settings')}</b><button class="icon-btn" data-a="close-settings">✕</button></div>
    <div class="lbl">${t('language')}</div>
    <div class="seg"><button class="${p.lang==='en'?'on':''}" data-a="set-lang" data-v="en">English</button><button class="${p.lang==='ko'?'on':''}" data-a="set-lang" data-v="ko">한국어</button></div>
    <div class="lbl">${t('country')}</div>
    <select class="field" data-c="set-country">${COUNTRIES.map(c => `<option value="${c.code}" ${p.country===c.code?'selected':''}>${c.flag} ${c[L()]}</option>`).join('')}</select>
    <div class="lbl">${t('currency')}</div>
    <select class="field" data-c="set-currency">${Object.keys(SAMPLE_RATES).map(k => `<option ${p.currency===k?'selected':''}>${k}</option>`).join('')}</select>
    <div style="display:grid;gap:8px;margin-top:18px">
      <button class="btn line" data-a="replay-tut">${t('replayTut')}</button>
      <button class="btn line" data-a="redo-ob">${t('redoOb')}</button>
      <button class="btn ghost" data-a="reset">${t('reset')}</button>
    </div>
  </div>`;
}
function renderTutorial() {
  const i = S.tutStep, last = i === 2;
  return `<div class="tut-scrim"></div>
  <div class="tut-bubble" style="--arrow-x:${[15, 47, 79][i]}%">
    <div style="font-size:14px;line-height:1.45"><span class="tut-num">${i + 1}</span>${t('tut' + (i + 1))}</div>
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <button class="btn ghost sm" data-a="tut-skip">${t('tutSkip')}</button>
      <div class="row"><span class="tiny muted">${i + 1} / 3</span><button class="btn sm" data-a="tut-next">${last ? t('tutDone') : t('tutNext')}</button></div>
    </div>
  </div>`;
}

/* ---------------- render loop ---------------- */
const $app = document.getElementById('app');
function render() {
  document.documentElement.lang = L();
  document.title = t('appName');
  const content = document.getElementById('content');
  const scroll = content ? content.scrollTop : 0;
  const ae = document.activeElement, focusId = ae && ae.id, caret = ae && ae.selectionStart;

  let html = '<div class="phone">';
  if (!S.profile) html += renderOnboarding();
  else {
    const screen = S.tab === 'home' ? renderHome() : S.tab === 'explore' ? renderExplore() : renderTrip();
    html += renderHeader() + `<main class="content" id="content">${sampleBanner()}${screen}</main>` + renderNav();
    if (S.cartOpen) html += renderCart();
    if (S.settingsOpen) html += renderSettings();
    if (!S.tutorialDone) html += renderTutorial();
  }
  if (S.toast) html += `<div class="toast">${esc(S.toast)}</div>`;
  $app.innerHTML = html + '</div>';

  const c2 = document.getElementById('content');
  if (c2) c2.scrollTop = S._top ? 0 : scroll;
  S._top = false;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); } }
}
const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];

function act(a, v) {
  const o = S.ob, p = S.profile;
  switch (a) {
    case 'ob-lang': o.lang = v; break;
    case 'ob-next': o.step++; break;
    case 'ob-back': o.step--; break;
    case 'ob-country': o.country = v; o.currency = countryOf(v).cur; break;
    case 'ob-gender': o.gender = o.gender === v ? '' : v; break;
    case 'ob-age': o.age = o.age === v ? '' : v; break;
    case 'ob-b': o.beauty = toggleIn(o.beauty, v); break;
    case 'ob-m': o.medical = toggleIn(o.medical, v); break;
    case 'ob-finish': {
      const skip = v === 'skip';
      S.profile = {lang:o.lang, country:o.country, currency:o.currency, gender:o.gender, age:o.age,
        prefs:{beauty: skip ? [] : o.beauty, medical: skip ? [] : o.medical}, usingNow: skip ? '' : o.usingNow, usingCat:''};
      S.tab = 'home'; S.tutStep = 0; S._top = true; persist(); break;
    }
    case 'tab': S.tab = v; S._top = true; break;
    case 'go': { const [d, l, s] = v.split(':'); S.domain = d; S.list = l; S.sort = s; S.selected = null; S.tab = 'explore'; S._top = true; break; }
    case 'open-item': {
      const isMed = !!findM(v); S.domain = isMed ? 'medical' : 'beauty';
      S.list = (isMed ? findM(v) : findB(v)).sponsored ? 'sponsor' : 'real'; S.sort = 'overall'; S.selected = v; S.tab = 'explore'; S._top = true; break;
    }
    case 'go-item': S.list = 'real'; S.sort = 'overall'; S.selected = v; break;
    case 'domain': S.domain = v; S.selected = null; if (v === 'medical') S.sort = 'overall'; break;
    case 'list': S.list = v; S.selected = null; break;
    case 'sort': S.sort = v; break;
    case 'select': S.selected = v; if (findB(v) && !findB(v).sponsored) S.list = 'real'; break;
    case 'add-cart': S.cart[v] = (S.cart[v] || 0) + 1; persist(); toast(t('added')); break;
    case 'qty': { const [id, d] = v.split(':'); const q = (S.cart[id] || 0) + +d; if (q <= 0) delete S.cart[id]; else S.cart[id] = q; persist(); break; }
    case 'toggle-trip': {
      const had = S.trip.includes(v); S.trip = had ? S.trip.filter(x => x !== v) : [...S.trip, v];
      persist(); toast(had ? t('removedTrip') : t('addedTrip')); break;
    }
    case 'open-cart': S.cartOpen = true; break;
    case 'close-cart': S.cartOpen = false; break;
    case 'cart-to-trip': S.cartOpen = false; S.tab = 'trip'; S._top = true; break;
    case 'open-settings': S.settingsOpen = true; break;
    case 'close-settings': S.settingsOpen = false; break;
    case 'set-lang': p.lang = v; persist(); break;
    case 'tut-next': if (S.tutStep < 2) { S.tutStep++; S.tab = ['home','explore','trip'][S.tutStep]; } else { S.tutorialDone = true; S.tab = 'home'; persist(); } break;
    case 'tut-skip': S.tutorialDone = true; S.tab = 'home'; persist(); break;
    case 'replay-tut': S.settingsOpen = false; S.tutorialDone = false; S.tutStep = 0; S.tab = 'home'; break;
    case 'redo-ob': S.settingsOpen = false; Object.assign(o, {step:0, lang:p.lang, country:p.country, currency:p.currency}); S.profile = null; break;
    case 'reset': localStorage.removeItem(KEY); location.href = location.pathname; return;
    case 'build-route': S.routeBuilt = true; persist(); break;
    case 'approve': S.approvals[v] = true; persist(); break;
    case 'prefs-toggle': S.prefsOpen = !S.prefsOpen; break;
    case 'pf-b': p.prefs.beauty = toggleIn(p.prefs.beauty, v); persist(); break;
    case 'pf-m': p.prefs.medical = toggleIn(p.prefs.medical, v); persist(); break;
    default: return;
  }
  render();
}

$app.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) act(el.dataset.a, el.dataset.v); });
$app.addEventListener('change', e => {
  const el = e.target.closest('[data-c]'); if (!el) return;
  const p = S.profile, v = el.value;
  if (el.dataset.c === 'ob-currency') S.ob.currency = v;
  if (el.dataset.c === 'set-country') { p.country = v; p.currency = countryOf(v).cur; }
  if (el.dataset.c === 'set-currency') p.currency = v;
  if (el.dataset.c === 'alt-cat') p.usingCat = v;
  persist(); render();
});
$app.addEventListener('input', e => {
  const el = e.target.closest('[data-i]'); if (!el) return;
  if (el.dataset.i === 'ob-using') S.ob.usingNow = el.value;           // no re-render needed
  if (el.dataset.i === 'alt-using') { S.profile.usingNow = el.value; persist(); render(); }
});

render();
</script>
</body>
</html>
